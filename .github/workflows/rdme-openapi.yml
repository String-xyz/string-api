# This GitHub Actions workflow was auto-generated by the `rdme` cli on 2023-05-10T21:33:14.389Z
# You can view our full documentation here: https://docs.readme.com/docs/rdme
name: ReadMe GitHub Action 🦉

on:
  push:
    branches:
      # This workflow will run every time you push code to the following branch: `develop`
      # Check out GitHub's docs for more info on configuring this:
      # https://docs.github.com/actions/using-workflows/events-that-trigger-workflows
      - develop

jobs:
  rdme-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo 📚
        uses: actions/checkout@v3

      - name: Set up Go environment
        uses: actions/setup-go@v2
        with:
          go-version: 1.19

      - name: Run `swag init` command 📦
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g /api/api.go

      - name: Run `openapi` command 🚀
        uses: readmeio/rdme@v8
        with:
          rdme: openapi docs/swagger.yaml --key=${{ secrets.README_API_KEY }} --id=${{ vars.README_DEV_DOCS_ID }}
