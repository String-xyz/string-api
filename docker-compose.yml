version: '3.8'
services:
  string-api:
    build:
      context: .
      dockerfile: dev.Dockerfile
    container_name: string-api
    ports:
      - 5555:5555
    depends_on:
      - db
      - redis
    volumes:
      - ./:/string_api
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=string_db
      - POSTGRES_PASSWORD=string_password
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
  redis:
    image: redis:7.0-alpine
    restart: always
    ports:
      - '6379:6379'
    ## We want the Redis data not to persist. 
    ## Commenting out the lines below is equivalent to run the command FLUSHALL after each restart
    ## Uncomment the following lines to persist data
    # volumes:
    #   - redis:/data

volumes:
  db:
    driver: local
    ## We want the Redis data not to persist. 
    ## Commenting out the lines below is equivalent to run the command FLUSHALL after each restart
    ## Uncomment the following lines to persist data
    # redis:
    #   driver: local
